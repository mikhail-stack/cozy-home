server {
    listen 80;
    server_name _;

    # Без завершающего "/" у backend:4000 — префикс "/api/" передаётся
    # бэкенду как есть: Express-роуты смонтированы на "/api/..."
    # (backend/src/app.ts), а не на корне. С "/" на конце nginx срезал бы
    # "/api/" перед проксированием, и все запросы отвечали бы 404 —
    # реальный баг, найденный при развёртывании (пункт 24 плана).
    location /api/ {
        proxy_pass http://backend:4000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://frontend:3000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
